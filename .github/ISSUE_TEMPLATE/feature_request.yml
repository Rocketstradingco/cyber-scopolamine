name: Feature request
description: Suggest a focused improvement to the installer or local coding experience.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the outcome you want, including any command or installer behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you tried?
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Include Windows, GPU, PowerShell, Ollama, aider, or model details when they affect the request.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request is for the local Cyber-Scopolamine installer or coding experience.
          required: true
